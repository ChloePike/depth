[package]
name = "t1-ffi"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
repository = "https://github.com/ChloePike/depth"

# C ABI for the SwiftUI host (app/): renders the egui terminal into an NSView through wgpu
# (Metal) and forwards input. Header: ffi/t1.h.
[lib]
crate-type = ["staticlib"]

[dependencies]
t1-ui = { path = "../ui" }
eframe = "0.36.2"
egui-wgpu = "0.36.2"
wgpu = "30.0.1"
raw-window-handle = "0.6.2"
pollster = "0.4"
png = "0.18.1"
