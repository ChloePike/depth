[package]
name = "t1-ui"
version = "0.4.2"
edition = "2024"
license = "GPL-3.0-or-later"
repository = "https://github.com/ChloePike/depth"

# The terminal: the eframe app (src/main.rs) with its egui interface (chart, book, panels).
[dependencies]
depth = { path = ".." }
anyhow = "1.0.104"
eframe = "0.36.2"
memmap2 = "0.9.11"
png = "0.18.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
subsecond = { version = "0.7.10", optional = true }
dioxus-devtools = { version = "0.7.10", optional = true }
tokio = { version = "1.53.2", features = ["full"] }
hidapi = "2.6.7"

[features]
# Live code patching: `dx serve --hotpatch -p t1-ui --features hotpatch --bin depth`
hotpatch = ["dep:subsecond", "dep:dioxus-devtools"]

[[bin]]
name = "depth"
path = "src/main.rs"

# menu bar (macOS) / notification area (Windows) item; Linux trays need GTK, left out
[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
tray-icon = "0.26.1"

# coloured menu bar title (the NSStatusItem button's attributed title); same versions as tray-icon's
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.5"
objc2-foundation = { version = "0.3.2", features = ["NSAttributedString", "NSString", "NSDictionary", "NSArray"] }
objc2-app-kit = { version = "0.3.2", features = ["NSApplication", "NSWindow", "NSView", "NSControl", "NSButton", "NSColor", "NSFont", "NSFontDescriptor", "NSAttributedString", "NSResponder"] }
