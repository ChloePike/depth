[package]
name = "t1-ui"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/ChloePike/depth"

# The terminal's egui interface (chart, book, panels), shared by the eframe app (src/main.rs)
# and the SwiftUI host (ffi/).
[dependencies]
terminal-one = { path = ".." }
anyhow = "1.0.104"
eframe = "0.36.2"
memmap2 = "0.9.11"
png = "0.18.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
subsecond = { version = "0.7.10", optional = true }
dioxus-devtools = { version = "0.7.10", optional = true }
tokio = { version = "1.53.2", features = ["full"] }

[features]
# Live code patching: `dx serve --hotpatch -p t1-ui --features hotpatch --bin terminal-one`
hotpatch = ["dep:subsecond", "dep:dioxus-devtools"]

[[bin]]
name = "terminal-one"
path = "src/main.rs"
