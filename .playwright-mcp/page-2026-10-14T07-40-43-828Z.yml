  - generic [ref=f1e40]:
    - heading "Websocket API v2" [level=1] [ref=f1e42]
    - heading "What Is WebSocket?" [level=2] [ref=f1e43]
    - paragraph [ref=f1e44]: WebSocket is a protocol providing full-duplex communications channels over a single TCP connection. The WebSocket protocol was standardized by the IETF as RFC 6455 in 2011, and the WebSocket API in Web IDL is being standardized by the W3C.
    - heading "Connection" [level=2] [ref=f1e45]
    - paragraph [ref=f1e46]:
      - text: "Bitstamp by Robinhood uses its implementation of websocket server for real time data streaming. Server is accessible on the following address:"
      - link "wss://ws.bitstamp.net" [ref=f1e47] [cursor=pointer]:
        - /url: wss://ws.bitstamp.net
      - text: .
    - paragraph [ref=f1e48]:
      - text: "Documentation about websocket protocol can be found on the following link:"
      - link "https://websockets.readthedocs.io/en/stable/" [ref=f1e49] [cursor=pointer]:
        - /url: https://websockets.readthedocs.io/en/stable/
      - text: .
    - paragraph [ref=f1e50]: Once you open a connection via websocket handshake (using HTTP upgrade header), you can subscribe to desired channels.
    - paragraph [ref=f1e51]: After this is accomplished, you will start to receive a stream of live events for every channel you are subscribed to.
    - heading "Subscriptions" [level=2] [ref=f1e52]
    - paragraph [ref=f1e53]:
      - strong [ref=f1e54]: Public channels
    - paragraph [ref=f1e55]: "To subscribe to a channel, JSON message must be sent to the server. It should have a following structure:"
    - generic [ref=f1e56]:
      - generic [ref=f1e57]: JSON
      - code [ref=f1e61]: "{ \"event\": \"bts:subscribe\", \"data\": { \"channel\": \"[channel_name]\" } }"
    - paragraph [ref=f1e62]:
      - strong [ref=f1e63]: Private channels
    - paragraph [ref=f1e64]: "To subscribe to a channel, JSON message must be sent to the server. It should have a following structure:"
    - generic [ref=f1e65]:
      - generic [ref=f1e66]: JSON
      - code [ref=f1e70]: "{ \"event\": \"bts:subscribe\", \"data\": { \"channel\": \"[channel_name]-[user-id]\", \"auth\": \"[token]\" } }"
    - paragraph [ref=f1e71]:
      - text: Token value and user id are generated via HTTP API. See Websockets token section of HTTP API documentation
      - link "here" [ref=f1e72] [cursor=pointer]:
        - /url: /api/
      - text: . The token is valid for
      - strong [ref=f1e73]: 60 seconds
      - text: from the time it is generated (
      - code [ref=f1e74]: "valid_sec: 60"
      - text: in the response). You must subscribe to all desired channels before the token expires; it cannot be reused for later subscriptions.
    - paragraph [ref=f1e75]:
      - strong [ref=f1e76]: "Note on sub-accounts:"
      - generic [ref=f1e77]:
        - text: Private channels are subscribed using the main account
        - strong [ref=f1e78]: userId
        - text: regardless of which sub-account you want to monitor. Once subscribed, each message includes a
        - strong [ref=f1e79]: trade_account_id
        - text: field (0 = main account; non-zero = sub-account ID) that you can use to filter events for a specific sub-account.
    - heading "Unsubscriptions" [level=2] [ref=f1e80]
    - paragraph [ref=f1e81]: You can also unsubscribe from the channel if you no longer need its stream. Again, you need to send a message to the server.
    - paragraph [ref=f1e82]: "Its structure is nearly identical to the subscription JSON:"
    - generic [ref=f1e83]:
      - generic [ref=f1e84]: JSON
      - code [ref=f1e88]: "{ \"event\": \"bts:unsubscribe\", \"data\": { \"channel\": \"[channel_name]\" } }"
    - paragraph [ref=f1e89]:
      - strong [ref=f1e90]: "Note:"
      - text: Messages described and defined in this article are the only ones that will be processed by the server. Any other form of message or correct form of message with unexpected content will result in an error response.
    - paragraph [ref=f1e91]:
      - strong [ref=f1e92]: "Connection limits:"
      - generic [ref=f1e93]:
        - text: A single WebSocket connection supports up to
        - strong [ref=f1e94]: 1024 channel subscriptions
        - text: . Attempting a 1025th subscription causes the connection to be silently closed — open additional connections before reaching the limit. Client-sent messages (subscribe / unsubscribe frames) must be small; keep them under 512 bytes.
