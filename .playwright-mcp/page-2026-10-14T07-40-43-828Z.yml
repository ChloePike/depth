    - paragraph [ref=f1e681]:
      - generic [ref=f1e682]:
        - text: Fires once for every fill (execution) against your orders. Each message represents a single matched trade, including partial fills. Use this channel for P&L tracking and trade reconciliation. Does
        - strong [ref=f1e683]: not
        - text: include maker/taker designation — see
        - strong [ref=f1e684]: trade_type
        - text: for the execution context (e.g. ORDERBOOK, POSITION_LIQUIDATION).
