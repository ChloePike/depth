      - text: "- JavaScript example:"
      - link "diff_order_book_v2.html" [ref=f1e371] [cursor=pointer]:
        - /url: https://assets.bitstamp.net/static/webapp/examples/diff_order_book_v2.1c9f7bedec23759336c617de3854c51a8a20da52.html
    - paragraph [ref=f1e372]:
      - strong [ref=f1e373]: "Note on crossed order book:"
      - text: Due to the nature of the broadcast model, a snapshot may occasionally show the best bid ≥ best ask. This reflects an in-flight state that will self-correct within the next message. Do not treat this as an arbitrage opportunity.
    - table [ref=f1e374]:
      - rowgroup [ref=f1e375]:
        - row [ref=f1e376]:
          - cell [ref=f1e377]:
            - strong [ref=f1e378]: Property
          - cell [ref=f1e379]:
            - strong [ref=f1e380]: Description
      - rowgroup [ref=f1e381]:
        - row [ref=f1e382]:
          - cell [ref=f1e383]:
            - strong [ref=f1e384]: bids
          - cell [ref=f1e385]:
            - text: List of changed bid price levels since last broadcast. Each entry is a
            - code [ref=f1e386]: "[price, amount]"
            - text: tuple. An
            - code [ref=f1e387]: amount
            - text: of
            - code [ref=f1e388]: "\"0\""
            - text: means the level has been fully consumed and should be removed from your local book.
        - row [ref=f1e389]:
          - cell [ref=f1e390]:
            - strong [ref=f1e391]: asks
          - cell "List of changed ask price levels since last broadcast. Same tuple format as bids." [ref=f1e392]
        - row [ref=f1e393]:
          - cell [ref=f1e394]:
            - strong [ref=f1e395]: timestamp
          - cell "Order book timestamp." [ref=f1e396]
        - row [ref=f1e397]:
          - cell [ref=f1e398]:
            - strong [ref=f1e399]: microtimestamp
          - cell "Order book microtimestamp. Use this value to sequence diff messages against the REST snapshot." [ref=f1e400]
    - paragraph [ref=f1e401]:
      - strong [ref=f1e402]: Reconciliation algorithm for diff_order_book
    - list [ref=f1e403]:
      - listitem [ref=f1e404]:
        - text: Subscribe to
        - code [ref=f1e405]: diff_order_book_[market]
        - text: and start buffering messages
        - emphasis [ref=f1e406]: before
        - text: requesting the snapshot.
      - listitem [ref=f1e407]:
        - text: Fetch a full order book snapshot via
        - code [ref=f1e408]: GET /api/v2/order_book/[market]/?group=1
        - text: .
      - listitem [ref=f1e409]:
        - text: Discard all buffered diff messages whose
        - code [ref=f1e410]: microtimestamp
        - text: is older than or equal to the snapshot's
        - code [ref=f1e411]: microtimestamp
        - text: .
      - listitem [ref=f1e412]: Apply the remaining buffered messages in order, then continue applying live messages.
      - listitem [ref=f1e413]:
        - text: For each entry
        - code [ref=f1e414]: "[price, amount]"
        - text: "in a diff: if"
        - code [ref=f1e415]: amount == "0"
        - text: remove that price level; otherwise set (or update) that level to the new amount.
    - paragraph [ref=f1e416]:
      - text: If you require gap resilience (reconnect scenarios), consider using
      - strong [ref=f1e417]: live_orders_[market]
      - text: instead — its
      - code [ref=f1e418]: event_id
      - text: /
      - code [ref=f1e419]: pre_event_id
      - text: top-level fields allow you to detect and recover missed events. See the
      - emphasis [ref=f1e420]: Gap detection and message recovery
      - text: section below.
    - generic [ref=f1e421]:
      - generic [ref=f1e422]: JSON example — diff_order_book_btcusd
      - code [ref=f1e426]: "{ \"event\": \"data\", \"channel\": \"diff_order_book_btcusd\", \"data\": { \"bids\": [ [\"61200.00\", \"0.75000000\"], [\"61150.00\", \"0\"] ], \"asks\": [ [\"61210.00\", \"1.50000000\"] ], \"timestamp\": \"1712100001\", \"microtimestamp\": \"1712100001000000\" } }"
