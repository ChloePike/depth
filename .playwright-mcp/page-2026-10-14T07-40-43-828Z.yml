    - heading "Other technical information" [level=2] [ref=f1e1142]
    - paragraph [ref=f1e1143]:
      - strong [ref=f1e1144]: 1. Heartbeat
    - paragraph [ref=f1e1145]: "If you wish to determine that websocket server is responsive, you should do so by websocket heartbeat. This is a form of control message or \"PING / PONG\" communication. You can do so by sending the following JSON message to the server:"
    - generic [ref=f1e1146]:
      - generic [ref=f1e1147]: JSON
      - code [ref=f1e1151]: "{ \"event\": \"bts:heartbeat\" }"
    - paragraph [ref=f1e1152]: "The server responds with:"
    - generic [ref=f1e1153]:
      - generic [ref=f1e1154]: JSON
      - code [ref=f1e1158]: "{ \"event\": \"bts:heartbeat\", \"channel\": \"\", \"data\": { \"status\": \"success\" } }"
    - paragraph [ref=f1e1159]:
      - strong [ref=f1e1160]: Subscription and unsubscription confirmations
    - paragraph [ref=f1e1161]: "After a successful subscription or unsubscription, the server sends a confirmation message:"
    - generic [ref=f1e1162]:
      - generic [ref=f1e1163]: JSON — subscription confirmed
      - code [ref=f1e1167]: "{ \"event\": \"bts:subscription_succeeded\", \"channel\": \"live_trades_btcusd\", \"data\": {} }"
    - generic [ref=f1e1168]:
      - generic [ref=f1e1169]: JSON — unsubscription confirmed
      - code [ref=f1e1173]: "{ \"event\": \"bts:unsubscription_succeeded\", \"channel\": \"live_trades_btcusd\", \"data\": {} }"
    - paragraph [ref=f1e1174]:
      - strong [ref=f1e1175]: Error responses
    - paragraph [ref=f1e1176]:
      - text: When a request cannot be processed, the server replies with a
      - code [ref=f1e1177]: bts:error
      - text: event. The
      - code [ref=f1e1178]: data
      - text: object contains a
      - code [ref=f1e1179]: message
      - text: string and an optional numeric
      - code [ref=f1e1180]: code
      - text: ":"
    - table [ref=f1e1182]:
      - rowgroup [ref=f1e1183]:
        - row [ref=f1e1184]:
          - cell [ref=f1e1185]:
            - strong [ref=f1e1186]: code
          - cell [ref=f1e1187]:
            - strong [ref=f1e1188]: message
          - cell [ref=f1e1189]:
            - strong [ref=f1e1190]: Cause
      - rowgroup [ref=f1e1191]:
        - row [ref=f1e1192]:
          - cell [ref=f1e1193]:
            - emphasis [ref=f1e1194]: "null"
          - cell "Incorrect JSON format." [ref=f1e1195]
          - cell "The message body could not be parsed as JSON." [ref=f1e1196]
        - row [ref=f1e1197]:
          - cell [ref=f1e1198]:
            - emphasis [ref=f1e1199]: "null"
          - cell "Bad subscription string." [ref=f1e1200]
          - cell [ref=f1e1201]:
            - text: The
            - code [ref=f1e1202]: channel
            - text: field is missing or not a string.
        - row [ref=f1e1203]:
          - cell "4009" [ref=f1e1204]
          - cell "Connection is unauthorized." [ref=f1e1205]
          - cell [ref=f1e1206]:
            - text: The
            - code [ref=f1e1207]: auth
            - text: token is invalid, expired (tokens are valid for 60 seconds), or does not match the channel's userId.
    - generic [ref=f1e1208]:
      - generic [ref=f1e1209]: JSON — error example
      - code [ref=f1e1213]: "{ \"event\": \"bts:error\", \"channel\": \"\", \"data\": { \"code\": 4009, \"message\": \"Connection is unauthorized.\" } }"
    - paragraph [ref=f1e1214]:
      - strong [ref=f1e1215]: 2. Forced reconnection
    - paragraph [ref=f1e1216]: "In case of websocket server you are currently connected to is to go under maintenance, you will receive a warning message asking you to reconnect. Such a message will look like this:"
    - generic [ref=f1e1217]:
      - generic [ref=f1e1218]: JSON
      - code [ref=f1e1222]: "{ \"event\": \"bts:request_reconnect\", \"channel\": \"\", \"data\": null }"
    - paragraph [ref=f1e1223]:
      - text: After you receive this request, you will have a few seconds to reconnect before the connection is closed. Reconnect and re-subscribe to resume receiving events; use the gap detection fields (
      - code [ref=f1e1224]: event_id
      - text: /
      - code [ref=f1e1225]: pre_event_id
      - text: ) to recover any events missed during the transition.
    - paragraph [ref=f1e1226]:
      - strong [ref=f1e1227]: 3. Maximum connection age
    - paragraph [ref=f1e1228]: Maximum connection age is 90 days from the time the connection is established. When that period of time elapses, you will be automatically disconnected and will need to re-connect.
    - paragraph [ref=f1e1229]:
      - strong [ref=f1e1230]: 4. Gap detection and message recovery
    - paragraph [ref=f1e1231]:
      - text: The
      - code [ref=f1e1232]: live_orders_[market]
      - text: and
      - code [ref=f1e1233]: private-my_orders_[market]-[userId]
      - text: channels include three
      - strong [ref=f1e1234]: top-level
      - text: fields (alongside
      - code [ref=f1e1235]: event
      - text: ","
      - code [ref=f1e1236]: channel
      - text: ", and"
      - code [ref=f1e1237]: data
      - text: ") that allow you to detect and recover from missed messages:"
    - list [ref=f1e1238]:
      - listitem [ref=f1e1239]:
        - strong [ref=f1e1240]: event_id
        - text: — unique identifier for this event as a lowercase 8-4-4-4-12 hex string (e.g.
        - code [ref=f1e1241]: "\"019f4ac8-5e3a-11ef-af00-3e9012000020\""
        - text: ).
      - listitem [ref=f1e1242]:
        - strong [ref=f1e1243]: pre_event_id
        - text: — the
        - code [ref=f1e1244]: event_id
        - text: of the immediately preceding event, or
        - code [ref=f1e1245]: "null"
        - text: after a server-side restart.
      - listitem [ref=f1e1246]:
        - strong [ref=f1e1247]: order_source
        - text: —
        - code [ref=f1e1248]: orderbook
        - text: ","
        - code [ref=f1e1249]: stop_order
        - text: or
        - code [ref=f1e1250]: tokenized_securities
        - text: ; use this as the
        - code [ref=f1e1251]: order_source
        - text: parameter when calling the private recovery endpoint.
    - paragraph [ref=f1e1252]:
      - strong [ref=f1e1253]: "Continuity check:"
      - text: After each message, compare its
      - code [ref=f1e1254]: pre_event_id
      - text: with the
      - code [ref=f1e1255]: event_id
      - text: of the last message you successfully processed. If they do not match, one or more events were missed — trigger gap recovery before processing further messages.
    - paragraph [ref=f1e1256]:
      - strong [ref=f1e1257]: "Restart signal:"
      - text: A
      - code [ref=f1e1258]: "null"
      - code [ref=f1e1259]: pre_event_id
      - text: "indicates a server restart. Treat this as an unconditional full-recovery trigger: fetch all events since your last known"
      - code [ref=f1e1260]: event_id
      - text: before resuming live processing.
    - paragraph [ref=f1e1261]:
      - strong [ref=f1e1262]: Recovery via REST
    - paragraph [ref=f1e1263]:
      - text: Both endpoints return up to
      - strong [ref=f1e1264]: 1 000 events
      - text: per call, ordered oldest to newest. An empty array means you have caught up and can resume live WebSocket processing. Events are retained for
      - strong [ref=f1e1265]: 30 days
      - text: ; if
      - code [ref=f1e1266]: since_id
      - text: is omitted the endpoint defaults to the
      - strong [ref=f1e1267]: last 24 hours
      - text: .
    - paragraph [ref=f1e1268]:
      - strong [ref=f1e1269]: Public order events
      - text: —
      - code [ref=f1e1270]: POST /api/v2/order_data/
    - table [ref=f1e1272]:
      - rowgroup [ref=f1e1273]:
        - row [ref=f1e1274]:
          - cell [ref=f1e1275]:
            - strong [ref=f1e1276]: Parameter
          - cell [ref=f1e1277]:
            - strong [ref=f1e1278]: Required
          - cell [ref=f1e1279]:
            - strong [ref=f1e1280]: Description
      - rowgroup [ref=f1e1281]:
        - row [ref=f1e1282]:
          - cell [ref=f1e1283]:
            - strong [ref=f1e1284]: market
          - cell "Yes" [ref=f1e1285]
          - cell [ref=f1e1286]:
            - text: Market symbol, e.g.
            - code [ref=f1e1287]: BTC/USD
            - text: .
        - row [ref=f1e1288]:
          - cell [ref=f1e1289]:
            - strong [ref=f1e1290]: since_id
          - cell "No" [ref=f1e1291]
          - cell [ref=f1e1292]:
            - text: Return events starting from this
            - code [ref=f1e1293]: event_id
            - text: (inclusive). Defaults to 24 h before
            - code [ref=f1e1294]: until_id
            - text: .
        - row [ref=f1e1295]:
          - cell [ref=f1e1296]:
            - strong [ref=f1e1297]: until_id
          - cell "No" [ref=f1e1298]
          - cell [ref=f1e1299]:
            - text: Return events up to this
            - code [ref=f1e1300]: event_id
            - text: (exclusive). Defaults to now.
    - paragraph [ref=f1e1301]:
      - strong [ref=f1e1302]: Private order events
      - text: —
      - code [ref=f1e1303]: POST /api/v2/account_order_data/
    - table [ref=f1e1305]:
      - rowgroup [ref=f1e1306]:
        - row [ref=f1e1307]:
          - cell [ref=f1e1308]:
            - strong [ref=f1e1309]: Parameter
          - cell [ref=f1e1310]:
            - strong [ref=f1e1311]: Required
          - cell [ref=f1e1312]:
            - strong [ref=f1e1313]: Description
      - rowgroup [ref=f1e1314]:
        - row [ref=f1e1315]:
          - cell [ref=f1e1316]:
            - strong [ref=f1e1317]: order_source
          - cell "Yes" [ref=f1e1318]
          - cell [ref=f1e1319]:
            - code [ref=f1e1320]: orderbook
            - text: ","
            - code [ref=f1e1321]: stop_order
            - text: or
            - code [ref=f1e1322]: tokenized_securities
            - text: . Must match the source embedded in the
            - code [ref=f1e1323]: event_id
            - text: you are recovering.
        - row [ref=f1e1324]:
          - cell [ref=f1e1325]:
            - strong [ref=f1e1326]: market
          - cell "Yes" [ref=f1e1327]
          - cell [ref=f1e1328]:
            - text: Market symbol, e.g.
            - code [ref=f1e1329]: BTC/USD
            - text: .
        - row [ref=f1e1330]:
          - cell [ref=f1e1331]:
            - strong [ref=f1e1332]: since_id
          - cell "No" [ref=f1e1333]
          - cell [ref=f1e1334]:
            - text: Return events starting from this
            - code [ref=f1e1335]: event_id
            - text: (inclusive). Defaults to 24 h before
            - code [ref=f1e1336]: until_id
            - text: .
        - row [ref=f1e1337]:
          - cell [ref=f1e1338]:
            - strong [ref=f1e1339]: until_id
          - cell "No" [ref=f1e1340]
          - cell [ref=f1e1341]:
            - text: Return events up to this
            - code [ref=f1e1342]: event_id
            - text: (exclusive). Defaults to now.
    - paragraph [ref=f1e1343]:
      - strong [ref=f1e1344]: "Note:"
      - text: Live WebSocket messages carry
      - code [ref=f1e1345]: event_id
      - text: and
      - code [ref=f1e1346]: pre_event_id
      - text: at the
      - strong [ref=f1e1347]: top level
      - text: of the message object (not inside
      - code [ref=f1e1348]: data
      - text: ). REST recovery responses also return
      - code [ref=f1e1349]: event_id
      - text: at the top level of each event in the array. Pass the
      - code [ref=f1e1350]: event_id
      - text: value from either source as
      - code [ref=f1e1351]: since_id
      - text: to page through missed events.
    - paragraph [ref=f1e1352]:
      - text: To page through more than 1 000 events, repeat the request with the
      - code [ref=f1e1353]: event_id
      - text: (from the REST response top level) of the last returned event as the new
      - code [ref=f1e1354]: since_id
      - text: until the response is empty.
