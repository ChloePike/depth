    - paragraph [ref=f1e550]:
      - generic [ref=f1e551]:
        - text: "Tracks the full lifecycle of your orders: creation, partial fills (amount decrements), cancellation, final deletion, and order replacement. Does"
        - strong [ref=f1e552]: not
        - text: carry trade/fill detail — use
        - strong [ref=f1e553]: Private My Trades
        - text: for that. Stop orders emit additional
        - code [ref=f1e554]: stop_active
        - text: /
        - code [ref=f1e555]: stop_inactive
        - text: events when their trigger condition is met or cancelled.
        - code [ref=f1e556]: order_replaced
        - text: is emitted when an existing order is amended; it carries the new order ID and includes
        - code [ref=f1e557]: orig_order_id
        - text: referencing the previous order. On the public
        - code [ref=f1e558]: live_orders
        - text: channel, replacements appear as
        - code [ref=f1e559]: order_created
        - text: .
