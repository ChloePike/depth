[workspace]
members = [".", "ui", "ffi"]
default-members = [".", "ui"]

[package]
name = "terminal-one"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
flate2 = "1.1.10"
futures-util = { version = "0.3.34", features = ["sink"] }
hex = "0.4.3"
hmac = "0.13.0"
k256 = { version = "0.14.0", features = ["ecdsa"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json", "gzip", "brotli", "zstd", "deflate"] }
rmp-serde = "1.3.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
sha3 = "0.12.0"
tokio = { version = "1.53.2", features = ["full"] }
yawc = { version = "0.4.2", default-features = false, features = ["rustls-aws-lc-rs", "zlib"] }

# Dev builds must keep up with ~10k msg/s: optimize dependencies fully, our code lightly.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
