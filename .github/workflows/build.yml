name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# creating a release and attaching the builds needs write access (the default token is read-only)
permissions:
  contents: write

jobs:
  # One job per host and OS:
  #   egui (ui/src/main.rs)  cross-platform: macOS, Windows, Linux
  #   SwiftUI host (app/)    macOS only
  #   WinUI 3 host (win/)    Windows only (never compiled before CI: allowed to fail until fixed)
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macos-egui, os: macos-26, asset: Depth-macos-arm64.zip, experimental: false }
          - { name: macos-swiftui, os: macos-26, asset: Depth-macos-arm64-swiftui.zip, experimental: false }
          - { name: windows-egui, os: windows-latest, asset: Depth-windows-x64.zip, experimental: false }
          - { name: windows-winui, os: windows-latest, asset: Depth-windows-x64-winui.zip, experimental: true }
          - { name: linux-egui, os: ubuntu-24.04, asset: Depth-linux-x64.tar.gz, experimental: false }
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.name }}
          # the SwiftUI bundle builds the staticlib into target/main
          workspaces: ${{ matrix.name == 'macos-swiftui' && '. -> target/main' || '. -> target' }}

      - name: Linux libraries (winit / wgpu, hidapi)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libwayland-dev libxcursor-dev libxrandr-dev libxi-dev libgl1-mesa-dev libx11-xcb-dev libudev-dev

      - name: Test
        # unit tests only: they need no network (exchanges block some runner regions); once per OS
        if: endsWith(matrix.name, '-egui')
        # t1-ffi embeds egui in the native hosts (macOS / Windows only): nothing to build on Linux
        run: cargo test --release --workspace ${{ runner.os == 'Linux' && '--exclude t1-ffi' || '' }}

      - name: Bundle (macOS, egui)
        if: matrix.name == 'macos-egui'
        run: |
          HOST=egui APP=dist/Depth.app scripts/bundle.sh
          ditto -c -k --keepParent dist/Depth.app dist/${{ matrix.asset }}

      - name: Bundle (macOS, SwiftUI)
        if: matrix.name == 'macos-swiftui'
        run: |
          APP=dist/Depth.app scripts/bundle.sh
          ditto -c -k --keepParent dist/Depth.app dist/${{ matrix.asset }}

      - name: Build (Windows, egui)
        if: matrix.name == 'windows-egui'
        shell: pwsh
        run: |
          cargo build --release -p t1-ui --bin depth
          New-Item -ItemType Directory -Force dist/Depth | Out-Null
          Copy-Item target/release/depth.exe dist/Depth/Depth.exe
          Compress-Archive -Path dist/Depth -DestinationPath dist/${{ matrix.asset }}

      - uses: actions/setup-dotnet@v4
        if: matrix.name == 'windows-winui'
        with:
          dotnet-version: "8.0.x"

      - name: Build (Windows, WinUI 3)
        if: matrix.name == 'windows-winui'
        shell: pwsh
        run: |
          cargo build --release -p t1-ffi
          dotnet publish win -c Release -p:Platform=x64 -o dist/Depth
          Compress-Archive -Path dist/Depth -DestinationPath dist/${{ matrix.asset }}

      - name: Build (Linux, egui)
        if: matrix.name == 'linux-egui'
        run: |
          cargo build --release -p t1-ui --bin depth
          mkdir -p dist/Depth && cp target/release/depth dist/Depth/depth
          tar -C dist -czf dist/${{ matrix.asset }} Depth

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: dist/${{ matrix.asset }}

  # Depth keyboard firmware (hardware/keyboard): the userspace and each board's keymap dropped into a
  # fresh QMK tree and compiled in QMK's own build image
  firmware:
    name: firmware
    runs-on: ubuntu-latest
    container: ghcr.io/qmk/qmk_cli
    steps:
      - uses: actions/checkout@v4

      - name: Build (Keychron Q6 ANSI knob)
        run: |
          git clone --depth 1 --recurse-submodules --shallow-submodules https://github.com/qmk/qmk_firmware /qmk
          cp -r hardware/keyboard/qmk/users/depth /qmk/users/depth
          mkdir -p /qmk/keyboards/keychron/q6/ansi_encoder/keymaps/depth
          cp hardware/keyboard/qmk/keymaps/keychron_q6_ansi_encoder/* /qmk/keyboards/keychron/q6/ansi_encoder/keymaps/depth/
          cd /qmk && qmk compile -kb keychron/q6/ansi_encoder -km depth
          mkdir -p "$GITHUB_WORKSPACE/dist" && cp /qmk/keychron_q6_ansi_encoder_depth.bin "$GITHUB_WORKSPACE/dist/Depth-keyboard-keychron-q6-ansi-knob.bin"

      - uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: dist/*.bin

  release:
    # after every build (a failed experimental build just leaves its file out)
    needs: [build, firmware]
    if: always() && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          body: |
            | File | App | OS |
            |---|---|---|
            | `Depth-macos-arm64.zip` | Depth (egui) | macOS, Apple silicon |
            | `Depth-macos-arm64-swiftui.zip` | Depth with the native SwiftUI shell | macOS, Apple silicon |
            | `Depth-windows-x64.zip` | Depth (egui) | Windows x64 |
            | `Depth-windows-x64-winui.zip` | Depth with the native WinUI 3 shell (first builds, untested) | Windows x64 |
            | `Depth-linux-x64.tar.gz` | Depth (egui) | Linux x64 |
            | `Depth-keyboard-keychron-q6-ansi-knob.bin` | Depth keyboard firmware (QMK + VIA) | Keychron Q6 ANSI with knob |

            macOS builds are ad-hoc signed: on first launch, right-click the app and choose Open.
            Windows builds are unsigned: SmartScreen asks once.
